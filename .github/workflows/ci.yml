name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build build --config Release

      - name: test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: fuzz
        run: ./build/fuzz_sort 200000 1
        if: runner.os != 'Windows'

      - name: fuzz (windows)
        run: .\build\Release\fuzz_sort.exe 200000 1
        if: runner.os == 'Windows'
