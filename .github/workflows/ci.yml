name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: build
        run: cmake --build build --config Release

      - name: test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: fuzz
        run: ./build/fuzz_sort 200000 1
        if: runner.os != 'Windows'

      - name: fuzz (windows)
        run: .\build\Release\fuzz_sort.exe 200000 1
        if: runner.os == 'Windows'

  sanitizers:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: configure ASan/UBSan
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer" "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: build ASan/UBSan
        run: cmake --build build-asan -j2

      - name: test ASan/UBSan
        run: ctest --test-dir build-asan --output-on-failure

      - name: fuzz ASan/UBSan
        run: ./build-asan/fuzz_cache 100000 1

